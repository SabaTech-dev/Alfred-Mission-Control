# =============================================================================
# SLSA L1/L3 Provenance Attestation — Alfred Mission Control
# Supply chain security for Docker images and npm package
# =============================================================================

name: SLSA Provenance

on:
  push:
    tags:
      - 'v*'
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write
  packages: write

concurrency:
  group: slsa-${{ github.ref }}
  cancel-in-progress: true

# GHCR/Docker exigen repositorios en lowercase; github.repository contiene
# mayúsculas (SabaTech-dev/Alfred-Mission-Control) y buildx rechaza el tag.
# Nombre canónico fijo del artefacto — usar SIEMPRE env.IMAGE_NAME.
env:
  IMAGE_NAME: ghcr.io/sabatech-dev/alfred-mission-control

jobs:
  provenance:
    name: Build & Attest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: true
          sbom: true

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [provenance]
    steps:
      - name: Summary
        run: |
          echo "## 🔏 SLSA L1 Provenance - Alfred Mission Control" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build provenance attestation attached to container image" >> $GITHUB_STEP_SUMMARY
          echo "✅ Attestation pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verification command:**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
