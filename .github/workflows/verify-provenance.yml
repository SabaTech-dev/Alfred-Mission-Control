# =============================================================================
# SLSA L1 — Verify npm Provenance (OWASP A03: Supply Chain)
# Verifies that npm packages have valid provenance
# =============================================================================

name: Verify npm Provenance

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  attestations: read
  id-token: write

jobs:
  verify:
    name: Verify npm Package Provenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify attestation
        run: |
          # List attestations for this commit
          gh attestation verify "${{ github.sha }}" \
            --owner ${{ github.repository_owner }} \
            --predicate-type https://slsa.dev/provenance/v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
