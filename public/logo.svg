<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#f0a500"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-strong">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle circuit lines (decorative) -->
  <g opacity="0.15" stroke="#00d4ff" stroke-width="1" fill="none">
    <path d="M 80 256 L 160 256 L 180 236 L 180 180"/>
    <circle cx="180" cy="176" r="4" fill="#00d4ff"/>
    <path d="M 432 256 L 352 256 L 332 276 L 332 332"/>
    <circle cx="332" cy="336" r="4" fill="#00d4ff"/>
    <path d="M 256 80 L 256 140 L 236 160 L 200 160"/>
    <circle cx="196" cy="160" r="4" fill="#00d4ff"/>
    <path d="M 256 432 L 256 372 L 276 352 L 312 352"/>
    <circle cx="316" cy="352" r="4" fill="#00d4ff"/>
    <path d="M 120 120 L 170 170"/>
    <path d="M 392 120 L 342 170"/>
    <path d="M 120 392 L 170 342"/>
    <path d="M 392 392 L 342 342"/>
  </g>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.6" filter="url(#glow)"/>

  <!-- Monogram A - main letterform -->
  <g filter="url(#glow-strong)">
    <!-- Left leg of A -->
    <path d="M 200 340 L 256 160 L 312 340" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Crossbar -->
    <path d="M 220 290 L 292 290" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Small AI dot indicator -->
  <circle cx="256" cy="145" r="6" fill="url(#gold)" filter="url(#glow)"/>

  <!-- Subtle neural network nodes around the A -->
  <g opacity="0.3">
    <circle cx="190" cy="200" r="3" fill="#00d4ff"/>
    <circle cx="322" cy="200" r="3" fill="#00d4ff"/>
    <circle cx="175" cy="310" r="3" fill="#7b2ff7"/>
    <circle cx="337" cy="310" r="3" fill="#7b2ff7"/>
    <line x1="190" y1="200" x2="200" y2="220" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="322" y1="200" x2="312" y2="220" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="175" y1="310" x2="200" y2="300" stroke="#7b2ff7" stroke-width="0.8"/>
    <line x1="337" y1="310" x2="312" y2="300" stroke="#7b2ff7" stroke-width="0.8"/>
  </g>

  <!-- Bottom text area - subtle brand line -->
  <line x1="200" y1="390" x2="312" y2="390" stroke="url(#gold)" stroke-width="1" opacity="0.3"/>
</svg>
